<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Salesforce Debugger</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <div class="header__title">
        <span class="header__name">Salesforce Debugger</span>
        <span class="header__badge" id="statusBadge" hidden></span>
      </div>
      <div class="header__actions">
        <button type="button" class="btn btn--ghost" id="btnRefresh" title="Refresh now">
          Refresh
        </button>
        <a class="btn btn--ghost" id="linkOptions" href="#" title="Settings">Settings</a>
      </div>
    </header>

    <p class="hint" id="hint">
      Open a Salesforce tab (Lightning or Setup), then load logs. The list refreshes automatically.
    </p>

    <div class="toolbar">
      <label class="field">
        <span>Every</span>
        <select id="refreshSelect" aria-label="Auto refresh interval">
          <option value="0">Manual only</option>
          <option value="10">10 s</option>
          <option value="15" selected>15 s</option>
          <option value="30">30 s</option>
          <option value="60">60 s</option>
        </select>
      </label>
      <label class="field field--user">
        <span>Log User</span>
        <select id="userFilterSelect" aria-label="Select user">
          <option value="__ALL__" selected>All</option>
        </select>
      </label>
      <label class="field">
        <span>Trace time</span>
        <select id="traceDurationSelect" aria-label="Trace duration">
          <option value="15" selected>15 min</option>
          <option value="30">30 min</option>
          <option value="60">60 min</option>
          <option value="120">120 min</option>
        </select>
      </label>
      <button type="button" class="btn btn--ghost" id="btnSetLog" title="Set trace flag">
        Set Log
      </button>
    </div>
    <p class="hint hint--status" id="traceStatus" hidden></p>
    <section class="debug-levels" aria-label="Debug level settings">
      <div class="debug-levels__title">Debug Level (all types)</div>
      <div class="debug-levels__grid">
        <label class="debug-field">
          <span>Apex Code</span>
          <select id="dbgApexCode"></select>
        </label>
        <label class="debug-field">
          <span>Apex Profiling</span>
          <select id="dbgApexProfiling"></select>
        </label>
        <label class="debug-field">
          <span>Callout</span>
          <select id="dbgCallout"></select>
        </label>
        <label class="debug-field">
          <span>Database</span>
          <select id="dbgDatabase"></select>
        </label>
        <label class="debug-field">
          <span>System</span>
          <select id="dbgSystem"></select>
        </label>
        <label class="debug-field">
          <span>Validation</span>
          <select id="dbgValidation"></select>
        </label>
        <label class="debug-field">
          <span>Visualforce</span>
          <select id="dbgVisualforce"></select>
        </label>
        <label class="debug-field">
          <span>Workflow</span>
          <select id="dbgWorkflow"></select>
        </label>
      </div>
    </section>

    <div class="list-wrap">
      <ul class="log-list" id="logList"></ul>
      <p class="empty" id="emptyState">No logs loaded yet.</p>
      <p class="error" id="errorState" hidden></p>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
