<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Salesforce Debugger</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="branding-bar">
      <div class="footer-content">
        <span class="footer-text">Apex Coverage Viewer</span>
        <span class="footer-divider">•</span>
        <span class="footer-text">Developed by <strong>Baibahv Kumar</strong></span>
        <a
          class="linkedin-link"
          href="https://www.linkedin.com/in/baibhav-kumar-1780685b/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Open Baibhav Kumar LinkedIn profile"
          title="LinkedIn"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M4.98 3.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM3 9h4v12H3zm7 0h3.83v1.64h.05c.53-1 1.84-2.05 3.79-2.05C21.5 8.59 22 11.1 22 14.36V21h-4v-5.89c0-1.41-.03-3.22-1.96-3.22-1.97 0-2.27 1.53-2.27 3.12V21h-4z"></path>
          </svg>
        </a>
        <a
          class="trailhead-link"
          href="https://www.salesforce.com/trailblazer/bkumar358"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Open Baibhav Kumar Trailblazer profile"
          title="Salesforce Trailblazer"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M16.8 18H7.3C4.9 18 3 16.3 3 14.1c0-1.8 1.3-3.4 3.1-3.9.6-2.5 2.8-4.2 5.4-4.2 2.6 0 4.8 1.7 5.4 4.2 1.8.4 3.1 2 3.1 3.9 0 2.2-1.9 3.9-4.2 3.9z"></path>
          </svg>
        </a>
        <span class="footer-divider">•</span>
        <span id="extension-version" class="footer-text">v-</span>
      </div>
    </div>
    <header class="header">
      <div class="header__brand">
        <h1 class="header__name">Salesforce Debugger</h1>
        <span class="header__count" id="statusBadge" hidden role="status" aria-live="polite"></span>
      </div>
      <div class="header__actions">
        <button type="button" class="btn btn--ghost btn--header" id="btnRefresh" title="Refresh now">
          Refresh
        </button>
        <a class="btn btn--ghost btn--header" id="linkOptions" href="#" title="Settings">Settings</a>
      </div>
    </header>

    <p class="hint hint--intro" id="hint">
      Open a Salesforce tab (Lightning or Setup), then load logs. The list refreshes automatically.
    </p>

    <div class="toolbar">
      <label class="field field--interval">
        <span>Every</span>
        <select id="refreshSelect" aria-label="Auto refresh interval">
          <option value="0">Manual only</option>
          <option value="10">10 s</option>
          <option value="15" selected>15 s</option>
          <option value="30">30 s</option>
          <option value="60">60 s</option>
        </select>
      </label>
      <div class="toolbar__user-row">
        <label class="field field--user field--user-row">
          <span>Log User</span>
          <input
            type="search"
            id="userSearchInput"
            placeholder="Type to search user"
            aria-label="Search users"
            autocomplete="off"
          />
          <div class="typeahead-list" id="userTypeaheadList" hidden></div>
        </label>
        <div class="toolbar__trace-actions">
          <button
            type="button"
            class="btn btn--brand btn--set-log"
            id="btnSetLog"
            title="Set trace flag for the selected user"
            disabled
          >
            Set Log
          </button>
          <button
            type="button"
            class="btn btn--destructive btn--remove-log"
            id="btnRemoveLog"
            title="No active debug trace for this user"
            disabled
          >
            Remove log
          </button>
        </div>
      </div>
    </div>
    <p class="hint hint--status" id="traceStatus" hidden></p>

    <div class="log-actions" id="logActionsBar">
      <label class="log-actions__select-all">
        <input type="checkbox" id="chkSelectAllLogs" />
        <span>Select all</span>
      </label>
      <div class="log-actions__buttons">
        <button type="button" class="btn btn--ghost btn--small" id="btnClearSelected">
          Delete selected
        </button>
        <button type="button" class="btn btn--danger btn--small" id="btnClearAllLogs" title="Deletes every Apex log you can query (see Log User filter)">
          Delete all…
        </button>
      </div>
    </div>

    <div class="list-wrap">
      <ul class="log-list" id="logList"></ul>
      <p class="empty" id="emptyState">No logs loaded yet.</p>
      <p class="error" id="errorState" hidden></p>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
