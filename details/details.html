<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Debug log — Salesforce Debugger</title>
    <link rel="stylesheet" href="details.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__left">
        <a class="link-back" id="btnClose" href="#">← Close</a>
        <h1 class="title">Apex debug log</h1>
      </div>
      <div class="topbar__right">
        <button type="button" class="btn" id="btnCopy">Copy raw log</button>
        <button type="button" class="btn btn--primary" id="btnReload">Reload</button>
      </div>
    </header>

    <section class="banner banner--loading" id="bannerLoading">Loading log…</section>
    <section class="banner banner--error" id="bannerError" hidden></section>

    <section class="summary" id="summary" hidden>
      <div class="summary__grid">
        <div class="pill"><span class="pill__label">Total lines</span> <span id="sumLines">—</span></div>
        <div class="pill"><span class="pill__label">Shown (filters)</span> <span id="sumShown">—</span></div>
        <div class="pill"><span class="pill__label">SOQL events</span> <span id="sumSoql">—</span></div>
        <div class="pill pill--danger"><span class="pill__label">Errors</span> <span id="sumErrors">—</span></div>
      </div>
    </section>

    <section class="error-panel" id="errorPanel" hidden>
      <h2 class="section-title">Errors &amp; exceptions</h2>
      <ul class="error-list" id="errorList"></ul>
    </section>

    <main class="log-main" id="logMain" hidden>
      <div class="log-filters" id="logFilters" role="group" aria-label="Log line filters">
        <span class="log-filters__title">Show categories</span>
        <label class="log-filters__item">
          <input type="checkbox" id="filterDebug" checked data-cat="debug" />
          Debug <span class="log-filters__hint">(USER_DEBUG)</span>
        </label>
        <label class="log-filters__item">
          <input type="checkbox" id="filterException" checked data-cat="exception" />
          Exceptions
        </label>
        <label class="log-filters__item">
          <input type="checkbox" id="filterQuery" checked data-cat="query" />
          Queries <span class="log-filters__hint">(SOQL)</span>
        </label>
        <label class="log-filters__item">
          <input type="checkbox" id="filterVariable" checked data-cat="variable" />
          Variable assignment
        </label>
      </div>
      <div class="log-table-host" id="logTableHost"></div>
    </main>

    <footer class="extension-footer">
      <div class="footer-content">
        <span class="footer-text">Apex Coverage Viewer</span>
        <span class="footer-divider">•</span>
        <span class="footer-text">Developed by <strong>Baibahv Kumar</strong></span>
        <a
          class="linkedin-link"
          href="https://www.linkedin.com/in/baibhav-kumar-1780685b/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Open Baibhav Kumar LinkedIn profile"
          title="LinkedIn"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M4.98 3.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM3 9h4v12H3zm7 0h3.83v1.64h.05c.53-1 1.84-2.05 3.79-2.05C21.5 8.59 22 11.1 22 14.36V21h-4v-5.89c0-1.41-.03-3.22-1.96-3.22-1.97 0-2.27 1.53-2.27 3.12V21h-4z"></path>
          </svg>
        </a>
        <a
          class="trailhead-link"
          href="https://www.salesforce.com/trailblazer/bkumar358"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Open Baibhav Kumar Trailblazer profile"
          title="Salesforce Trailblazer"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M16.8 18H7.3C4.9 18 3 16.3 3 14.1c0-1.8 1.3-3.4 3.1-3.9.6-2.5 2.8-4.2 5.4-4.2 2.6 0 4.8 1.7 5.4 4.2 1.8.4 3.1 2 3.1 3.9 0 2.2-1.9 3.9-4.2 3.9z"></path>
          </svg>
        </a>
        <span class="footer-divider">•</span>
        <span id="extension-version" class="footer-text">v-</span>
      </div>
    </footer>

    <script type="module" src="details.js"></script>
  </body>
</html>
